<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 32 32">
  <!-- OURO: an ouroboros. The body is a ring with a bite-sized gap; the
       head closes the circle onto its own tail. -->
  <circle cx="16" cy="16" r="11" fill="none" stroke="#f5a524" stroke-width="4.5"
          stroke-linecap="round" stroke-dasharray="57 12" transform="rotate(-55 16 16)"/>
  <!-- the head, swallowing the tail -->
  <path d="M23.2 5.2 a5 5 0 0 1 5.4 6.2 l-4.4 -1.2 z" fill="#f5a524"/>
  <circle cx="25.6" cy="8.2" r="1.1" fill="#0b0d12"/>
</svg>
